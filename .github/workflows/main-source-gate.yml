# Enforces branch flow: PRs into main may only come from develop.
# Make the job below a required status check on main's branch protection
# so merges from feature/bugfix branches stay blocked.
name: Main Source Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  enforce:
    name: Main PRs must come from develop
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_JSON=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          BASE_REF=$(echo "$PR_JSON" | jq -r .base.ref)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .head.ref)

          if [ "$BASE_REF" != "main" ]; then
            echo "PR base is '$BASE_REF' (not main); gate does not apply."
            exit 0
          fi

          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::PRs to main must come from 'develop' (got '$HEAD_REF'). Merge into develop first, then open develop → main."
            exit 1
          fi

          echo "OK: PR comes from develop."
