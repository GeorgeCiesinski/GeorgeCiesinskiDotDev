<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of George Ciesinski — software developer specializing in JavaScript, Python, and full-stack web development."
    />
    <title>George Ciesinski — Portfolio</title>
    <script>
      /**
       * Flash of unstyled content (FOUC)
       *
       * Automatically invokes to prevent screen flash before React finishes loading.
       */
      (function () {
        var key = "theme-pref";
        var pref = localStorage.getItem(key);
        // If no preset is set, default to system
        if (pref !== "light" && pref !== "dark" && pref !== "system")
          pref = "system";
        // Dark mode when set, or when system matches dark, otherwise light
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
